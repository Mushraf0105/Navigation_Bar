<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Responsive Navbar</title>
  <link rel="stylesheet" href="style.css" />
</head>

<body>
  <!-- Ambient Gradient Background Shapes for Glassmorphism Effect -->
  <div class="glow-orb orb-1"></div>
  <div class="glow-orb orb-2"></div>
  <div class="glow-orb orb-3"></div>

  <!-- Header / Glassmorphism Navigation Bar -->
  <header>
    <nav class="navbar">
      <a href="#" class="nav-logo">Veda Technology</a>

      <!-- Hamburger Button (Visible on mobile) -->
      <button class="hamburger" id="hamburger" aria-label="Toggle navigation menu">
        <span class="bar"></span>
        <span class="bar"></span>
        <span class="bar"></span>
      </button>

      <!-- Nav Links -->
      <ul class="nav-menu" id="nav-menu">
        <li class="nav-item"><a href="#home" class="nav-link active">Home</a></li>
        <li class="nav-item"><a href="#about" class="nav-link">About</a></li>
        <li class="nav-item"><a href="#services" class="nav-link">Services</a></li>
        <li class="nav-item"><a href="#portfolio" class="nav-link">Internship</a></li>
        <li class="nav-item"><a href="#contact" class="nav-link nav-btn">Contact</a></li>
      </ul>
    </nav>
  </header>

  <!-- Hero Content with Glass Card -->
  <main>
    <section class="hero" id="home">
      <div class="glass-card">
        <h1>Responsive Navigation Bar</h1>
        <p>Resize your browser window or view on a mobile device to test the frosted glass navbar, hamburger menu, and
          slide-in transition.</p>
      </div>
    </section>
  </main>

  <script src="script.js"></script>
</body>

</html>
